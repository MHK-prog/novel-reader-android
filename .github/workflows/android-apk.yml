name: Build and release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure persistent signing key
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Configure the persistent Android signing secrets before building an installable APK. See ANDROID_UPDATE_SIGNING.md."
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/novel-reader-debug.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          if [ ! -s "$keystore_path" ]; then
            echo "::error::The Android signing keystore could not be decoded."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug

      - name: Publish APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          project_version="$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)"
          if [[ "$version" != "$project_version" ]]; then
            echo "::error::Tag version $version does not match app/build.gradle versionName $project_version."
            exit 1
          fi

          apk_name="NovelReader-Android-v${version}-universal.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk_name"
          tag="$GITHUB_REF_NAME"
          previous_release="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')"

          if gh release view "$tag" >/dev/null 2>&1; then
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$apk_name"; then
              echo "Release $tag already has $apk_name; leaving the published asset unchanged."
            else
              gh release upload "$tag" "$apk_name"
            fi
          elif [[ -z "$previous_release" ]]; then
            gh release create "$tag" "$apk_name" --title "Novel Reader Android $version" \
              --notes "First direct APK release. The universal APK supports the Android device architectures covered by this Java-only app." \
              --verify-tag
          else
            gh release create "$tag" "$apk_name" --title "Novel Reader Android $version" \
              --generate-notes --verify-tag
          fi
