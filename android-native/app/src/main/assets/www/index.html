<header class="topbar"><button class="menu-button" id="menuButton" type="button" aria-label="باز کردن فهرست" aria-expanded="false"><img src="./icons/menu.svg" alt=""></button><h1 id="topTitle">کتابخانه‌ی کتاب‌ها</h1></header><div class="sidebar-scrim" id="sidebarScrim"></div><aside class="sidebar" id="sidebar" aria-label="منوی برنامه"><div class="sidebar-head"><strong>فهرست</strong><button type="button" class="sidebar-close" data-close-sidebar aria-label="بستن منو">×</button></div><nav class="sidebar-actions"><button type="button" id="sideAddBook"><img src="./icons/add-book.svg" alt=""><span>افزودن کتاب</span></button><button type="button" id="sideAddTag"><img src="./icons/tag.svg" alt=""><span>افزودن تگ</span></button><button type="button" id="sideFilterTags"><img src="./icons/tag.svg" alt=""><span>فیلتر تگ‌ها</span></button><hr><button type="button" id="sideExport"><img src="./icons/export.svg" alt=""><span>دریافت نسخه‌ی پشتیبان</span></button><button type="button" id="sideImport"><img src="./icons/import.svg" alt=""><span>وارد کردن نسخه‌ی پشتیبان</span></button></nav></aside>
<main>
<section class="page" id="page-dashboard"><div class="wrap"><h2 class="section-title">کتاب‌ها</h2><div class="library-tools"><input id="bookSearch" type="search" placeholder="جست‌وجوی کتاب، نویسنده یا تگ" aria-label="جست‌وجوی کتاب‌ها"></div><button type="button" class="tag-filter-button" id="openTagFilter"><img src="./icons/tag.svg" alt=""><span>فیلتر تگ‌ها</span><span id="activeTagCount" class="active-tag-count"></span></button><div class="book-list" id="worksList"></div></div></section>
<section class="page hidden" id="page-chapters"><div class="wrap"><div class="backline"><button class="button" id="chapterBack">بازگشت</button><h2 id="chapterBookTitle"></h2><button class="button" id="editChapterBook">ویرایش</button></div><div class="subtle" id="chapterAuthor" style="font-size:12px;margin:-7px 0 15px"></div><div id="chapterList"></div></div></section>
<section class="page hidden" id="page-reader"><div class="wrap"><div class="reader-sticky" id="readerSticky"><div class="reader-head"><button class="button" id="readerBack">فصل‌ها</button><div class="reader-titles"><strong id="readerBookTitle"></strong><small id="readerChapterTitle"></small></div><button class="mode-toggle" id="modeToggle" type="button" aria-label="رفتن به نوشتن" title="نوشتن"><img id="modeIcon" src="./icons/pencil.svg" alt=""></button></div><div class="reader-progress"><span id="readerProgressFill"></span></div></div><div id="writeNotice" class="notice hidden">برای این فصل هنوز متنی ذخیره نشده؛ متن فصل را بنویس.</div><div class="read-area" id="readArea"><article class="reading-text" id="readingText"></article></div><textarea class="editor hidden" id="chapterEditor" placeholder="متن فصل را اینجا بنویس…"></textarea><div class="reader-toolbar" id="readerToolbar"><button class="chapter-nav" id="prevReaderChapter" type="button" aria-label="فصل قبل"><img src="./icons/arrow-next.svg" alt=""></button><div class="reader-toolbar-actions"><button type="button" class="toolbar-import hidden" id="importChapter" aria-label="وارد کردن فایل" title="وارد کردن فایل"><img src="./icons/paperclip.svg" alt=""></button><input id="chapterFile" type="file" accept=".txt,.md,text/plain,text/markdown" hidden><button class="icon-action hidden" id="saveText" type="button" aria-label="ذخیره‌ی متن" title="ذخیره‌ی متن"><img src="./icons/save.svg" alt=""></button></div><button class="chapter-nav" id="nextReaderChapter" type="button" aria-label="فصل بعد"><img src="./icons/arrow-prev.svg" alt=""></button></div></div></section>
</main><footer class="app-footer" id="versionLabel" aria-label="نسخه‌ی برنامه">نسخهٔ ۰.۱.۰</footer>
<dialog class="modal" id="appModal"><div class="modal-head"><h2 id="modalTitle"></h2><button class="modal-close" id="modalClose" aria-label="بستن">بستن</button></div><div id="modalBody"></div></dialog><div class="toast" id="toast"></div>
<script src="./app.js"></script>
</body>
</html>
